<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1920">
  <meta name="robots" content="noindex">
  <title>LUNA LIGHT GARDEN</title>
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="stylesheet" href="./assets/css/common.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/luna-game.css">
  <link rel="preload" href="./assets/images/luna/garden-restored.webp" as="image">
</head>
<body class="luna-game">
  <header class="luna-game__header">
    <div class="luna-game__identity"><h1>LUNA LIGHT GARDEN</h1><p data-i18n="luna.game.title">세 군락을 깨우고, 중앙 Lotus에 빛을 보내세요.</p></div>
    <div class="luna-game__progress"><span class="luna-fragment-mark" aria-hidden="true">◇</span><span data-luna-progress-label>꽃 군락 복구</span><b data-luna-count>0 / 3</b><span class="luna-game__milestones" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
    <nav class="luna-game__tools" aria-label="미션 조작" data-i18n-aria-label="luna.game.tools">
      <button class="ui-button ui-button--secondary" type="button" data-luna-guide data-i18n="mission.guideButton">가이드</button>
      <button class="ui-button ui-button--icon" type="button" data-luna-pause aria-label="일시정지" data-i18n-aria-label="mission.pause"><span aria-hidden="true">Ⅱ</span></button>
    </nav>
  </header>
  <main class="luna-game__viewport" tabindex="0" aria-label="빛 연결 정원. 작은 화면에서는 가로로 이동할 수 있어요." data-i18n-aria-label="luna.game.viewport">
    <section class="luna-garden" aria-label="Prism 회전 정원 퍼즐" data-i18n-aria-label="luna.game.board" data-luna-garden>
      <div class="luna-garden__scene" data-luna-scene>
        <img class="luna-garden__background" src="./assets/images/luna/garden-dormant.webp" alt="" fetchpriority="high">
        <div class="luna-garden__ambient" aria-hidden="true"></div>
        <svg class="luna-garden__light" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true"><g data-luna-rays></g></svg>
        <div class="luna-source" aria-hidden="true"><i></i></div>
        <div data-luna-objects></div>
      </div>
      <div class="luna-garden__completion" role="status" data-luna-completion hidden><span data-i18n="luna.game.completeEyebrow">정원 복구 완료</span><h2 data-i18n="luna.game.completeTitle">정원이 다시 숨 쉬어요</h2><p data-i18n="luna.game.completeCopy">모든 꽃과 중앙 연꽃이 깨어났어요.</p></div>
    </section>
  </main>
  <footer class="luna-game__footer">
    <aside class="luna-game__eve" aria-label="EVE" aria-live="polite" aria-atomic="true"><span class="luna-game__portrait"><img src="./assets/images/common/eve.webp" alt=""></span><div><b>EVE</b><p data-eve-message>Prism의 두 연결면을 빛의 방향에 맞춰보세요.</p></div></aside>
  </footer>
  <dialog class="ui-dialog mission-dialog luna-game__dialog" aria-labelledby="luna-dialog-title" data-luna-dialog>
    <section class="ui-panel ui-overlay__dialog mission-result mission-result--paused" data-luna-pause-panel></section>
    <section class="mission-flow ui-panel" data-luna-guide-panel hidden>
      <header class="mission-flow__header"><div class="mission-flow__identity"><span class="ui-panel__eyebrow">LUNA LIGHT GARDEN</span><h2 data-i18n="mission.guideButton">가이드</h2></div><button class="ui-button ui-button--icon mission-guide__close" type="button" data-luna-guide-close data-i18n-aria-label="mission.guideClose" aria-label="미션 가이드 닫기"><svg class="ui-icon" aria-hidden="true"><use href="./assets/images/common/icon-sprite.svg#icon-close"></use></svg></button></header>
      <div class="mission-phase mission-guide">
        <div class="mission-guide__visual luna-guide" data-luna-practice>
          <span class="ui-panel__eyebrow" data-i18n="mission.demoTitle">미션 미리 해보기</span>
          <div class="luna-guide__board">
            <svg viewBox="0 0 600 300" aria-hidden="true"><circle cx="70" cy="170" r="12" fill="#edfff3"/><path d="M 82 170 H 200" class="luna-guide__beam"/><path d="M 200 170 V 35" class="luna-guide__beam is-loose" data-luna-practice-ray/><g class="luna-guide__flower" transform="translate(480 170)"><ellipse cy="24" rx="45" ry="12" fill="#476654"/><g class="luna-guide__petals" fill="#f7dfb3"><ellipse cy="-16" rx="13" ry="29"/><ellipse cy="-16" rx="13" ry="29" transform="rotate(60)"/><ellipse cy="-16" rx="13" ry="29" transform="rotate(120)"/><ellipse cy="-16" rx="13" ry="29" transform="rotate(180)"/><ellipse cy="-16" rx="13" ry="29" transform="rotate(240)"/><ellipse cy="-16" rx="13" ry="29" transform="rotate(300)"/></g><circle r="9" fill="#efbd60"/></g><path class="luna-guide__diamond" d="M 480 60 l 13 16 -13 16 -13 -16 Z" fill="none" stroke="#edfff3" stroke-width="3"/></svg>
            <button class="luna-guide__crystal" type="button" data-luna-practice-rotate data-i18n-aria-label="luna.guide.rotate" aria-label="크리스탈 돌리기"></button>
          </div>
          <p role="status" aria-live="polite"><span data-luna-practice-feedback></span></p>
          <div class="mission-guide__demo-actions"><button class="ui-button ui-button--secondary" type="button" data-luna-practice-reset data-i18n="mission.demoReset" hidden>다시 연습</button></div>
        </div>
        <div class="mission-guide__content"><span class="ui-panel__eyebrow">LUNA LIGHT GARDEN</span><h3 id="luna-guide-title" data-i18n="luna.guide.title"></h3><p data-i18n="luna.guide.description"></p><ol class="ui-info-list ui-info-list--boxed ui-info-list--angular"><li class="ui-info-list__item"><b>01</b><span class="ui-info-list__content"><strong data-i18n="luna.guide.step1Title"></strong><small data-i18n="luna.guide.step1"></small></span></li><li class="ui-info-list__item"><b>02</b><span class="ui-info-list__content"><strong data-i18n="luna.guide.step2Title"></strong><small data-i18n="luna.guide.step2"></small></span></li><li class="ui-info-list__item"><b>03</b><span class="ui-info-list__content"><strong data-i18n="luna.guide.step3Title"></strong><small data-i18n="luna.guide.step3"></small></span></li></ol><button class="ui-button ui-button--primary" type="button" data-luna-guide-resume></button></div>
      </div>
    </section>
  </dialog>
  <noscript><p class="luna-game__noscript">이 정원 게임에는 JavaScript가 필요해요.</p></noscript>
  <script type="module" src="./assets/js/luna-game.js"></script>
</body>
</html>
